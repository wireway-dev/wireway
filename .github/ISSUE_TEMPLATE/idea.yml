name: Idea
description: Something you'd like Wireway to do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like to do
      description: The task you have in mind, more than the feature that would solve it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Optional. Another tool, a workaround, or not at all.
